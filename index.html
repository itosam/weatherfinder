<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <img
          class="weather-bg"
          src="assets/weather/bgog.svg"
          alt="weather-background"
        />
    <div class="card">
      <row>
        <column>
      <p>
        <a class="home-link" href="index.html">weather finder</a>
      </p>
    </column>
    <column>
    <button class = "toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
          <img
          class="toggle-icon"
          src = "assets/toggle.png"
          alt = ""/>
   </button>
      </column>
      </row>
      <div class="weather">
        <row>
        <h1 class="temp">It's 78°  </h1> 
        <img
          class="weather-icon"
          src="assets/weather/cloud.svg"
          alt="weather-icon"
        /></row>
        
        <div class="search">
        in <input type="text" placeholder="City, state, or ZIP" spellcheck="false" aria-label="City, state, or ZIP code" />
        <button type="button" aria-label="Search weather"><img class="search-icon" src="assets/search.png" alt="" /></button>
        </div>
        <p class="status" role="status" aria-live="polite"></p>
        <div class="details">
          <p class="humidity">33% Humidity</p>
         <p class="wind"> 22mph Wind Speed</p>
        </div>
      </div>
    </div>
  <script src="src/index.js"></script>
  </body>
</html>
